name: Radar INTA Lechero diario

on:
  schedule:
    - cron: '0 23 * * *'
      timezone: 'America/Argentina/Cordoba'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-inta-lechero-diario
  cancel-in-progress: false

jobs:
  generar-informe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Ejecutar Radar INTA Lechero (sin IA)
        env:
          TZ: America/Argentina/Cordoba
          RADAR_SCAN_SOCIAL: '1'
          PYTHONUNBUFFERED: '1'
        run: python radar_lechero.py
      - name: Guardar informes diarios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add informes/noticiasinta_*.html informes/noticiasinta_*.xls
          if git diff --cached --quiet; then
            echo "No hay cambios en los informes de hoy."
          else
            git commit -m "Generar Radar INTA Lechero $(TZ=America/Argentina/Cordoba date +%d/%m/%Y)"
            git push
          fi
